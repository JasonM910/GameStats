name: GameStats CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and compile Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race ./...
      - name: Check code
        run: go vet ./...
      - name: Compile application
        run: go build -o "$RUNNER_TEMP/gamestats" .

  container:
    name: Test Scala and run Go to Scala
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build Go image
        run: docker build -t gamestats-go:ci .
      - name: Build Scala image and run Scala tests
        run: docker build -t gamestats-scala:ci ./scala
      - name: Run the complete flow and prepare deliverables
        run: |
          mkdir -p "$RUNNER_TEMP/gamestats-output" "$RUNNER_TEMP/gamestats-artifacts"
          docker run --rm \
            --mount "type=bind,source=$RUNNER_TEMP/gamestats-output,target=/output" \
            gamestats-go:ci -output /output/partidas.json
          test -s "$RUNNER_TEMP/gamestats-output/partidas.json"
          docker run --rm \
            --mount "type=bind,source=$RUNNER_TEMP/gamestats-output,target=/output" \
            gamestats-scala:ci
          test -s "$RUNNER_TEMP/gamestats-output/resultados.json"
          python3 - "$RUNNER_TEMP/gamestats-output/partidas.json" "$RUNNER_TEMP/gamestats-output/resultados.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              partidas = json.load(source)
          with open(sys.argv[2], encoding="utf-8") as source:
              resultados = json.load(source)

          assert partidas["schemaVersion"] == resultados["schemaVersion"] == 1
          assert len(partidas["matches"]) == len(resultados["matches"]) == 9
          assert {m["gameId"] for m in partidas["matches"]} == {"PACMAN", "MINESWEEPER", "CHESS", "MEMORY"}
          assert {m["gameId"] for m in resultados["matches"]} == {"PACMAN", "MINESWEEPER", "CHESS", "MEMORY"}
          by_id = {m["matchId"]: m for m in partidas["matches"]}
          assert by_id["C001"]["players"] == ["PLAYER04", "PLAYER05"]
          assert by_id["MEM001"]["players"] == ["PLAYER08"]
          assert by_id["MEM002"]["players"] == ["PLAYER09"]
          assert resultados["players"] and resultados["games"]
          assert resultados["metrics"] and resultados["patterns"]
          PY
          docker save gamestats-go:ci -o "$RUNNER_TEMP/gamestats-artifacts/gamestats-go.tar"
          cp "$RUNNER_TEMP/gamestats-output/partidas.json" "$RUNNER_TEMP/gamestats-artifacts/partidas.json"
          cp "$RUNNER_TEMP/gamestats-output/resultados.json" "$RUNNER_TEMP/gamestats-artifacts/resultados.json"
      - name: Upload Go image and example outputs
        uses: actions/upload-artifact@v7
        with:
          name: gamestats
          path: ${{ runner.temp }}/gamestats-artifacts/
          retention-days: 7
          if-no-files-found: error
