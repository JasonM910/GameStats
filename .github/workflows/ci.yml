name: GameStats CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Test and compile Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false
      - name: Test with race detector
        run: CGO_ENABLED=1 go test -race ./...
      - name: Check code
        run: go vet ./...
      - name: Compile application
        run: go build -o "$RUNNER_TEMP/gamestats" .

  container:
    name: Test Scala and run Go to Scala
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build Go image
        run: docker build -t gamestats-go:ci .
      - name: Build Scala image and run Scala tests
        run: docker build -t gamestats-scala:ci ./scala
      - name: Run the complete flow and prepare deliverables
        run: |
          mkdir -p "$RUNNER_TEMP/gamestats-output" "$RUNNER_TEMP/gamestats-artifacts"
          docker run --rm \
            --mount "type=bind,source=$RUNNER_TEMP/gamestats-output,target=/output" \
            gamestats-go:ci -matches 8 -seed 42 -interval 0 -output /output/partidas.json
          test -s "$RUNNER_TEMP/gamestats-output/partidas.json"
          docker run --rm \
            --mount "type=bind,source=$RUNNER_TEMP/gamestats-output,target=/output" \
            gamestats-scala:ci
          test -s "$RUNNER_TEMP/gamestats-output/resultados.json"
          python3 - "$RUNNER_TEMP/gamestats-output/partidas.json" "$RUNNER_TEMP/gamestats-output/resultados.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              partidas = json.load(source)
          with open(sys.argv[2], encoding="utf-8") as source:
              resultados = json.load(source)

          assert partidas["schemaVersion"] == resultados["schemaVersion"] == 1
          assert len(partidas["matches"]) == len(resultados["matches"]) == 8
          assert {m["gameId"] for m in partidas["matches"]} == {"PACMAN", "MINESWEEPER", "CHESS", "MEMORY"}
          assert {m["gameId"] for m in resultados["matches"]} == {"PACMAN", "MINESWEEPER", "CHESS", "MEMORY"}
          assert all(sum(m["gameId"] == game for m in partidas["matches"]) == 2 for game in ("PACMAN", "MINESWEEPER", "CHESS", "MEMORY"))
          assert all(len(m["players"]) == (2 if m["gameId"] == "CHESS" else 1) for m in partidas["matches"])
          assert all(sum(e["type"] == "MATCH_FINISHED" for e in m["events"]) == len(m["players"]) for m in partidas["matches"])
          assert resultados["players"] and resultados["games"]
          assert resultados["metrics"]
          assert all(m["result"] != "UNFINISHED" for m in resultados["matches"])
          PY
          docker save gamestats-go:ci -o "$RUNNER_TEMP/gamestats-artifacts/gamestats-go.tar"
          cp "$RUNNER_TEMP/gamestats-output/partidas.json" "$RUNNER_TEMP/gamestats-artifacts/partidas.json"
          cp "$RUNNER_TEMP/gamestats-output/resultados.json" "$RUNNER_TEMP/gamestats-artifacts/resultados.json"
      - name: Upload Go image and example outputs
        uses: actions/upload-artifact@v7
        with:
          name: gamestats
          path: ${{ runner.temp }}/gamestats-artifacts/
          retention-days: 7
          if-no-files-found: error
      - name: Start HTTP services with persistent JSON
        run: |
          docker network create gamestats-ci
          docker run -d --name gamestats-analyzer --network gamestats-ci gamestats-scala:ci --serve
          docker run -d --name gamestats-api --network gamestats-ci \
            -p 127.0.0.1:8080:8080 \
            -e GAMESTATS_ANALYZER_URL=http://gamestats-analyzer:8081/analyze \
            -e GAMESTATS_DATA=/output/api/partidas.json \
            --mount "type=bind,source=$RUNNER_TEMP/gamestats-output,target=/output" \
            gamestats-go:ci -serve
      - name: Validate API and restart persistence
        run: |
          python3 demo/check_api.py http://127.0.0.1:8080 "$RUNNER_TEMP/gamestats-output/partidas.json"
          docker restart gamestats-api
          python3 demo/check_api.py http://127.0.0.1:8080 "$RUNNER_TEMP/gamestats-output/partidas.json"
      - name: API logs
        if: failure()
        run: |
          docker logs gamestats-api || true
          docker logs gamestats-analyzer || true
      - name: Stop HTTP services
        if: always()
        run: |
          docker rm -f gamestats-api gamestats-analyzer || true
          docker network rm gamestats-ci || true
